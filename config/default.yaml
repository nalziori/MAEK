  sizing_sd_mm: {value: 0.2, unit: mm, assumption: true, note: 피트 깊이 측정 오차 표준편차}
  bootstrap: {value: 200, assumption: true, note: 상한 예측용 모수적 부트스트랩 반복 수}
  upper_q: {value: 0.95, assumption: true, note: 부트스트랩 분위수(예측 상한)}
  k_values: {value: [4, 8, 16], assumption: true, note: 회로당 스캔 창 개수 후보}
  min_maxima: {value: 3, assumption: true, note: Gumbel 적합에 필요한 최소 최댓값 개수(미만이면 관측 최댓값으로 대체)}
  circuit_keys: {value: [medium, area, material, nps, decade], assumption: true, note: 부식 회로 묶음 기준(decade = 설치연도 10년 단위)}
  fallback_margin_sd: {value: 2.0, assumption: true, note: 최댓값 부족(대체 판정) 시 관측 최댓값에 더하는 측정오차 표준편차 배수}
  gumbel_method: {value: "극값(Gumbel) 분포로 영역별 최대 피트 깊이를 외삽", source: "https://arxiv.org/pdf/2507.16416", note: "ASTM G46/Kowaka 극값법; GEV 일반화와 피트 군집(비독립) 한계도 논의"}
