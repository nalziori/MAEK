<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MAEK 제철소 검사 현황</title>
    <link
      rel="preload"
      href="assets/fonts/PretendardVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="operations.css" />
    <link rel="stylesheet" href="ut-live.css" />
    <script src="operations-data.js" defer></script>
    <script src="inspection-evidence.js" defer></script>
    <script src="operations.js" defer></script>
    <script src="ut-live.mjs" type="module"></script>
    <script src="thermal-live.mjs" type="module"></script>
    <link rel="stylesheet" href="thermal-live.css" />
  </head>
  <body>
    <nav class="side-nav" aria-label="주요 화면">
      <a class="rail-brand" href="index.html" aria-label="MAEK 홈">MAEK</a
      ><a
        href="?tab=home"
        data-tab="home"
        aria-label="현장 점검"
        title="현장 점검"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3 10 9-7 9 7v11H3zM9 21v-8h6v8" /></svg
        ><span>현장 점검</span></a
      ><a
        href="?tab=pipes"
        data-tab="pipes"
        aria-label="배관 조회"
        title="배관 조회"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3h14v18H5zM8 7h8M8 12h8M8 17h5" /></svg
        ><span>배관 조회</span></a
      >
      <a href="?tab=thermal" data-tab="thermal" aria-label="드론 열화상 훈련" title="드론 열화상 훈련"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a2 2 0 0 1 4 0v10a4 4 0 1 1-4 0V4zM12 9v8"/></svg><span>열화상 훈련</span></a>
      <p class="connection">실시간 드론<br />미연결</p>
    </nav>
    <main>
      <div class="page-title">
        <div>
          <h1 id="page-title" tabindex="-1">현장 점검</h1>
          <p id="page-description">
            어디까지 검사했고, 어디를 확인해야 하는지 살펴봅니다.
          </p>
        </div>
        <span class="data-mode">시연 자료 · 실시간 미연결</span>
      </div>
      <section class="playback" aria-label="저장 기록 재생" hidden>
        <div class="playback-heading">
          <strong id="replay-position">재생 위치</strong
          ><span>계획 경로 순서로 재구성 · 실시간 현황 아님</span>
        </div>
        <div class="playback-controls">
          <button type="button" id="play" aria-label="기록 재생 시작">
            재생</button
          ><label class="sr-only" for="progress">배관 경로 재생 단계</label
          ><input
            id="progress"
            type="range"
            min="0"
            max="247"
            value="125"
          /><span id="progress-label">125 / 247</span
          ><button type="button" class="last-record" id="last-record">
            마지막 기록
          </button>
        </div>
      </section>
      <div id="screen"></div>
      <input type="file" id="ndt-file" accept="application/json,.json" hidden />
      <p
        id="ndt-announcement"
        class="sr-only"
        role="status"
        aria-live="polite"
      ></p>
    </main>
    <dialog id="media-viewer" aria-labelledby="media-title">
      <header class="media-header">
        <h2 id="media-title">크게 보기</h2>
        <button
          type="button"
          id="close-media"
          class="icon-button"
          aria-label="크게 보기 닫기"
          title="닫기"
        >
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </header>
      <div id="media-content"></div>
    </dialog>
    <noscript>지도와 검사 목록을 보려면 JavaScript를 켜 주세요.</noscript>
  </body>
</html>
