<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAEK · AI 모델 직접 돌려보기</title>
<link rel="stylesheet" href="../sim/sim.css">
<link rel="stylesheet" href="try.css">
</head>
<body>
<div class="app">
  <aside class="left" aria-label="모델 선택">
    <a class="brand" href="../">MAEK</a>
    <section class="scenario">
      <p class="kicker">직접 해보기</p>
      <h1>AI 모델 직접 돌려보기</h1>
      <p class="desc">샘플을 고르면 MAEK의 AI 모델이 이 브라우저 안에서 바로 판정합니다. 영상은 PC 밖으로 나가지 않습니다.</p>
    </section>
    <ol class="phases" id="models" aria-label="모델">
      <li><button type="button" data-model="corrosion"><span class="n">1</span><span>부식 분할</span><span class="tm">드론 RGB 영상</span></button></li>
      <li><button type="button" data-model="thermal"><span class="n">2</span><span>열점 검출</span><span class="tm">드론 열화상</span></button></li>
      <li><button type="button" data-model="ultrasonic"><span class="n">3</span><span>피팅 판정</span><span class="tm">초음파 A-scan</span></button></li>
    </ol>
    <div class="links">
      <a href="../sim/">시뮬레이션으로 돌아가기</a>
      <a href="../">소개로 돌아가기</a>
    </div>
  </aside>

  <main class="stage try" aria-label="입력과 출력">
    <section class="win" data-win="in">
      <header><h2 id="in-title">입력</h2></header>
      <div class="body"><canvas id="in" aria-label="모델 입력"></canvas></div>
    </section>
    <section class="win" data-win="out">
      <header><h2 id="out-title">AI 출력</h2><label class="truth-toggle" id="truth-wrap"><input type="checkbox" id="truth"> 정답 겹쳐 보기</label></header>
      <div class="body">
        <canvas id="out" aria-label="모델 출력"></canvas>
        <div class="busy" id="busy" hidden><div class="spin"></div><p id="busy-text"></p></div>
      </div>
    </section>
    <section class="win samples-win" data-win="samples">
      <header><h2>샘플 고르기</h2></header>
      <ul class="samples" id="samples" aria-label="샘플"></ul>
    </section>
  </main>

  <aside class="right" aria-label="판정 결과">
    <h2>판정 결과</h2>
    <div class="verdict" id="verdict" aria-live="polite"></div>
    <h2>모델 정보</h2>
    <dl class="info" id="info"></dl>
  </aside>
</div>

<div class="narrow" id="narrow">
  <p><strong>이 화면은 PC 화면에 맞춰져 있습니다.</strong><br>PC에서 다시 열어 주세요.</p>
  <p><a class="primary-link" href="../#3">시연 영상 보기</a> <button type="button" id="narrow-go">그래도 보기</button></p>
</div>
<script type="module" src="try.js"></script>
</body>
</html>
