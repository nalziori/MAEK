# 모든 말단 파라미터: value + (source URL | assumption: true), 선택 unit/note
network:
  total_km: {value: 100, unit: km, assumption: true, note: 가상 제철소 배관망 총 길이}
  segment_m: {value: 50, unit: m, assumption: true, note: 세그먼트 길이}
  media_mix:
    cooling_water: {value: 0.25, assumption: true, note: 냉각수 비율}
    steam: {value: 0.20, assumption: true, note: 증기}
    byproduct_gas_co: {value: 0.15, assumption: true, note: 부생가스(CO)}
    oxygen: {value: 0.08, assumption: true, note: 산소}
    nitrogen: {value: 0.10, assumption: true, note: 질소}
    pickling_acid_hf: {value: 0.07, assumption: true, note: 산세액(불산)}
    compressed_air: {value: 0.15, assumption: true, note: 압축공기}
  install_year_min: {value: 1975, unit: year, assumption: true}
  install_year_max: {value: 2020, unit: year, assumption: true}
  insulated_fraction: {value: 0.45, assumption: true, note: 보온 배관 비율}
  elevated_fraction: {value: 0.60, assumption: true, note: 가공(파이프랙) 배관 비율}
  reference_year: {value: 2026, unit: year, assumption: true, note: 경년 계산 기준 연도}
  insulated_prob_steam: {value: 0.95, assumption: true, note: 증기 배관 보온 확률(그 외 매질은 insulated_fraction, PVC는 보온 없음)}
  t_min_frac: {value: 0.5, assumption: true, note: "최소 허용 두께 = 공칭 두께 × 비율 (B31.3 계산 대신 단순화)"}
  traffic_levels: {value: [0, 1, 2], assumption: true, note: "주변 통행량 등급 0~2 (균등 선택)"}
  nps_weights:
    nps_2: {value: 0.30, assumption: true}
    nps_4: {value: 0.30, assumption: true}
    nps_8: {value: 0.25, assumption: true}
    nps_12: {value: 0.15, assumption: true}
  material:
    acid_pvc: {value: 0.6, assumption: true, note: 산세액 배관 PVC 비율(나머지 스테인리스)}
    oxygen_stainless: {value: 0.3, assumption: true, note: 산소 배관 스테인리스 비율}
    other_stainless: {value: 0.05, assumption: true, note: 그 외 매질 스테인리스 비율(나머지 탄소강)}
  area_by_medium:
    cooling_water: {value: [제선, 제강, 압연, 발전], assumption: true}
    steam: {value: [발전, 압연, 제강], assumption: true}
    byproduct_gas_co: {value: [제선, 제강, 발전], assumption: true}
    oxygen: {value: [산소공장, 제강, 제선], assumption: true}
    nitrogen: {value: [산소공장, 제강, 압연], assumption: true}
    pickling_acid_hf: {value: [산세], assumption: true}
    compressed_air: {value: [제선, 제강, 압연, 산세], assumption: true}
  temp_c_by_medium:
    cooling_water: {value: [25, 60], unit: C, assumption: true}
    steam: {value: [100, 220], unit: C, assumption: true}
    byproduct_gas_co: {value: [30, 90], unit: C, assumption: true}
    oxygen: {value: [-10, 40], unit: C, assumption: true}
    nitrogen: {value: [-10, 40], unit: C, assumption: true}
    pickling_acid_hf: {value: [40, 85], unit: C, assumption: true}
    compressed_air: {value: [20, 60], unit: C, assumption: true}
  features_per_km:
    weld: {value: 85, unit: 1/km, assumption: true, note: 약 12m 스풀마다 원주 용접}
    support: {value: 125, unit: 1/km, assumption: true, note: 약 8m 간격 지지대}
    elbow: {value: 15, unit: 1/km, assumption: true}
    tee: {value: 6, unit: 1/km, assumption: true}
    flange: {value: 10, unit: 1/km, assumption: true}
    valve_downstream: {value: 4, unit: 1/km, assumption: true}
    orifice_downstream: {value: 1, unit: 1/km, assumption: true}
    nozzle: {value: 3, unit: 1/km, assumption: true}
    dead_leg: {value: 0.5, unit: 1/km, assumption: true}
  pipe_sizes:
    nps_2:
      od_mm: {value: 60.3, unit: mm, source: "https://www.engineeringtoolbox.com/steel-pipes-dimensions-d_43.html", note: "ASME B36.10, NPS 2 외경"}
      wall_mm: {value: 3.91, unit: mm, source: "https://www.engineeringtoolbox.com/steel-pipes-dimensions-d_43.html", note: "ASME B36.10 SCH 40"}
    nps_4:
      od_mm: {value: 114.3, unit: mm, source: "https://www.engineeringtoolbox.com/steel-pipes-dimensions-d_43.html", note: "ASME B36.10, NPS 4 외경"}
      wall_mm: {value: 6.02, unit: mm, source: "https://www.engineeringtoolbox.com/steel-pipes-dimensions-d_43.html", note: "ASME B36.10 SCH 40"}
    nps_8:
      od_mm: {value: 219.1, unit: mm, source: "https://www.engineeringtoolbox.com/steel-pipes-dimensions-d_43.html", note: "ASME B36.10, NPS 8 외경"}
      wall_mm: {value: 8.18, unit: mm, source: "https://www.engineeringtoolbox.com/steel-pipes-dimensions-d_43.html", note: "ASME B36.10 SCH 40"}
    nps_12:
      od_mm: {value: 323.9, unit: mm, source: "https://www.engineeringtoolbox.com/steel-pipes-dimensions-d_43.html", note: "ASME B36.10, NPS 12 외경"}
      wall_mm: {value: 10.31, unit: mm, source: "https://www.engineeringtoolbox.com/steel-pipes-dimensions-d_43.html", note: "ASME B36.10 SCH 40 (표준 STD 9.53 mm 아님)"}
defects:
  age_ref_years: {value: 30, unit: year, assumption: true, note: "경년 배율 = (경년/기준)^지수"}
  age_exponent: {value: 1.0, assumption: true}
  exposure_frac_range: {value: [0.1, 0.6], assumption: true, note: "감육 진행 기간 = 경년 × U(범위) (부식 개시 지연 반영)"}
  consequence_gain: {value: 0.5, assumption: true, note: "결함 확률 배율 = 1 + gain × (피해등급-1)/4"}
  external_corrosion:
    rate_per_km: {value: 6, unit: 1/km, assumption: true, note: 비보온 탄소강, 기준 경년에서 기대 개수}
  internal_pitting:
    rate_per_km: {value: 2, unit: 1/km, assumption: true, note: 습식 매질 금속 배관}
    media: {value: [cooling_water, steam, byproduct_gas_co, pickling_acid_hf], assumption: true}
  flange_leak:
    p_per_flange: {value: 0.03, assumption: true, note: 기준 경년에서 플랜지당 누설 확률}
  cui:
    temp_min_c: {value: -12, unit: C, source: "https://www.fabrico.io/blog/corrosion-under-insulation/", note: CUI 발생 온도 하한}
    temp_max_c: {value: 175, unit: C, source: "https://www.fabrico.io/blog/corrosion-under-insulation/", note: CUI 발생 온도 상한}
    peak_min_c: {value: 60, unit: C, source: "https://www.fabrico.io/blog/corrosion-under-insulation/", note: 피크 구간 하한}
    peak_max_c: {value: 120, unit: C, source: "https://www.fabrico.io/blog/corrosion-under-insulation/", note: 피크 구간 상한}
    location_weight:
      support: {value: 0.35, source: "https://inspectioneering.com/blog/2014-12-08/4286/what-is-corrosion-under-insulation-cui", note: 지지대; 가중치 수치는 정성 서술 기반 정규화}
      nozzle: {value: 0.25, source: "https://inspectioneering.com/blog/2014-12-08/4286/what-is-corrosion-under-insulation-cui", note: 노즐}
      dead_leg: {value: 0.25, source: "https://inspectioneering.com/blog/2014-12-08/4286/what-is-corrosion-under-insulation-cui", note: 데드레그}
      straight: {value: 0.15, assumption: true, note: 직관부 기본 확률}
    rate_per_km: {value: 4, unit: 1/km, assumption: true, note: 보온 탄소강, CUI 온도대, 기준 경년}
    peak_factor: {value: 2.0, assumption: true, note: 60~120C 피크 구간 발생 배율}
    external_sign_prob: {value: 0.4, assumption: true, note: 보온 외장에 얼룩/변형 징후가 보일 확률}
  fac:
    location_weight:
      elbow: {value: 0.40, source: "https://www.intechopen.com/chapters/39784", note: 엘보 하류}
      tee: {value: 0.25, source: "https://www.intechopen.com/chapters/39784", note: 티 하류}
      orifice: {value: 0.20, source: "https://www.intechopen.com/chapters/39784", note: 오리피스 하류}
      valve: {value: 0.15, source: "https://www.intechopen.com/chapters/39784", note: 밸브 하류}
      straight: {value: 0.05, assumption: true, note: 직관부(정규화 전)}
    rate_per_km: {value: 3, unit: 1/km, assumption: true, note: 수/증기 탄소강, 기준 경년}
    media: {value: [cooling_water, steam], assumption: true}
    rate_factor: {value: 2.0, assumption: true, note: 감육 속도 배율(부식속도 분포 대비)}
  corrosion_rate:
    mean_mm_per_year: {value: 0.15, unit: mm/yr, assumption: true, note: 로그정규 평균}
    sigma_log: {value: 0.6, assumption: true, note: 로그정규 시그마}
    max_mm_per_year: {value: 1.5, unit: mm/yr, assumption: true}
  crack:
    length_mean_mm: {value: 8.0, unit: mm, assumption: true}
    length_sigma_log: {value: 0.5, assumption: true}
    depth_frac_mean: {value: 0.25, assumption: true, note: 두께 대비 깊이 비율 평균}
    depth_frac_max: {value: 0.8, assumption: true}
    rate_per_km: {value: 1, unit: 1/km, assumption: true, note: 금속 배관, 기준 경년}
    critical_height_frac: {value: 0.4, assumption: true, note: 두께 대비 균열 높이가 이 값 초과면 critical}
    growth_mm_per_year: {value: 0.05, unit: mm/yr, assumption: true}
    location_weight:
      weld: {value: 0.6, assumption: true}
      elbow: {value: 0.3, assumption: true}
      straight: {value: 0.1, assumption: true}
risk:
  consequence:
    oxygen: {value: 5, assumption: true, note: 피해등급 1~5, 화재·폭발}
    pickling_acid_hf: {value: 5, assumption: true, note: 불산 독성}
    byproduct_gas_co: {value: 5, assumption: true, note: CO 중독·폭발}
    steam: {value: 3, assumption: true, note: 화상}
    nitrogen: {value: 2, assumption: true, note: 질식}
    compressed_air: {value: 1, assumption: true}
    cooling_water: {value: 1, assumption: true}
ut:
  v_long: {value: 5920, unit: m/s, source: "https://materialwelding.com/ultrasonic-velocity-chart/", note: 강 종파 속도}
  v_shear: {value: 3240, unit: m/s, source: "https://materialwelding.com/ultrasonic-velocity-chart/", note: 강 횡파 속도}
  temp_coeff_mps_per_c: {value: -0.7, unit: m/s/C, source: "https://tractian.com/en/glossary/speed-of-sound", note: 온도 계수(약)}
  probe_freq_mhz: {value: 5, unit: MHz, assumption: true}
  sampling_mhz: {value: 100, unit: MHz, assumption: true}
  angle_beam_angles_deg: {value: [45, 60, 70], unit: deg, assumption: true}
  noise_std: {value: 0.02, assumption: true, note: 가우시안 노이즈 표준편차(정규화 진폭)}
  grain_noise_std: {value: 0.01, assumption: true, note: 결정립 산란 노이즈}
camera:
  image_size: {value: 640, unit: px, assumption: true}
  brightness_range: {value: [0.5, 1.5], assumption: true, note: 조명 배율}
  dust_opacity_range: {value: [0.0, 0.4], assumption: true, note: 분진}
  steam_opacity_range: {value: [0.0, 0.5], assumption: true, note: 증기}
  negative_frac: {value: 0.4, assumption: true, note: 결함 없는 음성 이미지 비율}
  pipe_width_frac_range: {value: [0.35, 0.7], assumption: true, note: 이미지 높이 대비 배관 외경 폭}
  tilt_deg_range: {value: [-15, 15], unit: deg, assumption: true, note: 배관 기울기(시점)}
  blur_sigma_range: {value: [0.0, 2.0], unit: px, assumption: true, note: 초점/모션 블러}
  noise_sigma_range: {value: [0.0, 0.04], assumption: true, note: 센서 노이즈(0-1 스케일)}
  view_window_pad: {value: 1.0, assumption: true, note: 시야 안 결함 포함 여지(이미지 폭 배수)}
  min_defect_px: {value: 6, unit: px, assumption: true, note: 렌더 결함 최소 크기}
strategy:
  cost_ut_point_krw: {value: 150000, unit: KRW, assumption: true, note: UT 1점 측정}
  cost_scaffold_krw: {value: 2000000, unit: KRW, assumption: true, note: 비계 설치}
  cost_drone_per_km_krw: {value: 500000, unit: KRW/km, assumption: true, note: 드론 촬영}
  cost_labor_hour_krw: {value: 50000, unit: KRW/h, assumption: true}
onboard:
  target_fps: {value: 5, unit: fps, assumption: true}
  memory_limit_gb: {value: 2, unit: GB, assumption: true}
